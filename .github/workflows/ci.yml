name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test Suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Download WordNets (cached)
        run: python ci/download_wordnets.py

      - name: Run test suite
        run: python -m pytest -q --tb=short
        timeout-minutes: 20

      - name: Verify engine-lang CLI
        # --fail-fast no existe: argparse abortaba con exit 2 y continue-on-error
        # lo tapaba, asi que este paso nunca verifico nada. Sin la flag imprime el
        # informe real (hoy 5/8 idiomas: HE y JA fallan corpus, TR no tiene wordnet).
        run: engine-lang verify
        continue-on-error: true

      - name: Smoke test resolve + lower + codegen
        run: python ci/smoke_test.py

  test-linux:
    name: Test Suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Download WordNets (cached)
        run: python ci/download_wordnets.py

      - name: Run test suite
        run: python -m pytest -q --tb=short
        timeout-minutes: 20

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install "ruff==0.16.4" "mypy==2.3.1"

      - name: Ruff lint
        run: ruff check src/ tests/ --output-format=github

      - name: MyPy type check
        run: mypy src/intentlang --ignore-missing-imports

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, test-linux, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: unzip -l dist/*.whl | grep -E "(languages|contracts)" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  evidence:
    name: Generate Evidence Report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Download WordNets
        run: python ci/download_wordnets.py

      - name: Run verifier
        run: python ci/run_verifier.py 2>&1 | tee evidence_report.txt || true

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-report
          path: evidence_report.txt
          retention-days: 30