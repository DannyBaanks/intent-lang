[project]
name = "intentlang"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["wn>=0.9.5", "simplemma>=1.0.0", "jieba>=0.42.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
